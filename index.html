<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d10" />
  <title>Mahmud Camera Stock — Sales Management</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="assets/logo.png" alt="Mahmud Camera Stock" class="brand-logo" />
        <div>
          <div class="brand-name">Mahmud</div>
          <div class="brand-sub">CAMERA STOCK</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-page="dashboard"><span>⌂</span>Dashboard</button>
        <button class="nav-item" data-page="products"><span>▣</span>Products</button>
        <button class="nav-item" data-page="buying"><span>↓</span>Buying</button>
        <button class="nav-item" data-page="sales"><span>＋</span>New Sale</button>
        <button class="nav-item" data-page="returns"><span>↩</span>Returns</button>
        <button class="nav-item" data-page="customers"><span>◉</span>Customers</button>
        <button class="nav-item" data-page="suppliers"><span>◇</span>Suppliers</button>
        <button class="nav-item" data-page="inventory"><span>▤</span>Inventory</button>
        <button class="nav-item" data-page="expenses"><span>−</span>Expenses</button>
        <button class="nav-item" data-page="reports"><span>◒</span>Reports</button>
        <button class="nav-item" data-page="invoices"><span>▧</span>Invoices</button>
        <button class="nav-item" data-page="settings"><span>⚙</span>Settings</button>
      </nav>
      <div class="sidebar-footer">
        <div class="secure-dot"></div>
        <div><strong>Local Mode</strong><small>Data saved in browser</small></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div class="breadcrumb"><span>Mahmud Camera Stock</span><b>/</b><strong id="pageTitle">Dashboard</strong></div>
        <div class="top-actions">
          <button class="icon-btn" id="quickSaleBtn" title="New sale">＋</button>
          <button class="icon-btn" id="backupBtn" title="Export backup">⇩</button>
          <div class="profile"><div class="avatar">MC</div><div><strong>Admin</strong><small>Owner</small></div></div>
        </div>
      </header>

      <div id="app" class="content"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
